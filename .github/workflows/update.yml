name: Update Kimi Code

on:
  schedule:
    # Run every 6 hours to catch new releases
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-kimi-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      fail_reason: ${{ steps.check.outputs.fail_reason }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check for updates
        id: check
        continue-on-error: true
        run: |
          echo "Fetching latest kimi-code version..."
          # Harden the fetch: fail fast on connect, retry transient errors,
          # and fall back to the CDN edge (cdn.kimi.com) if the origin
          # (behind an anti-DDoS proxy) is unreachable from the runner.
          ERR_LOG="$(mktemp)"
          fetch_latest() {
            curl -fsSL --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 3 --retry-all-errors "$1" 2>>"$ERR_LOG" | tr -d '[:space:]' || true
          }
          LATEST_VERSION="$(fetch_latest "https://code.kimi.com/kimi-code/latest")"
          if [ -z "$LATEST_VERSION" ]; then
            echo "Primary endpoint unreachable, trying CDN..."
            LATEST_VERSION="$(fetch_latest "https://cdn.kimi.com/kimi-code/latest")"
          fi

          if [ -z "$LATEST_VERSION" ]; then
            REASON="Both code.kimi.com and cdn.kimi.com unreachable after retries. Last error: $(tail -n 1 "$ERR_LOG" 2>/dev/null || echo 'unknown')"
            echo "fail_reason=${REASON}" | tr -d '\n\r' >> "$GITHUB_OUTPUT"
            echo "Could not fetch latest version."
            exit 1
          fi
          echo "fail_reason=" >> "$GITHUB_OUTPUT"
          echo "Latest: $LATEST_VERSION"

          CURRENT_VERSION=$(jq -r '.version' version.json)
          echo "Current: $CURRENT_VERSION"

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "New version available!"
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Already up to date."
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update to new version
        if: steps.check.outputs.update_needed == 'true'
        run: |
          chmod +x ./update-version.sh
          ./update-version.sh "${{ steps.check.outputs.version }}"

      - name: Commit and Push
        if: steps.check.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update kimi-code to ${{ steps.check.outputs.version }}"
          git push

      - name: Close resolved failure issues
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="auto-failure"
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number --jq '.[].number')
          for n in $OPEN; do
            echo "Closing auto-failure issue #$n (workflow succeeded again)"
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "The Update Kimi Code workflow succeeded again — closing automatically."
          done

      # continue-on-error above would let the job pass; fail the run when the check failed.
      - name: Fail the run
        if: steps.check.outcome == 'failure'
        run: exit 1

  report-failure:
    runs-on: ubuntu-latest
    needs: update-kimi-code
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="auto-failure"
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          REASON="${{ needs.update-kimi-code.outputs.fail_reason }}"
          [ -n "$REASON" ] || REASON="See the failed run logs for details."

          TITLE="[auto] Update Kimi Code workflow failed"
          BODY=$(printf 'The **Update Kimi Code** workflow failed on %s.\n\n- Run: %s/%s/actions/runs/%s\n- Job: update-kimi-code\n\n**Failure reason:** %s\n\n_This issue was created automatically. It will be closed automatically when the workflow succeeds again._\n' "$(date -u +'%Y-%m-%d %H:%M UTC')" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$REASON")

          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Failure issue #$EXISTING already open — adding comment instead."
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Still failing on run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — $REASON"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi
