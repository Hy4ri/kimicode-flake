name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**.nix'
      - 'version.json'
      - 'flake.lock'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build kimi-code
        run: nix build .#kimi-code --no-link
